---
- name: Install Prometheus
  apt:
    name: prometheus
    state: present
    update_cache: yes

- name: Configure Prometheus
  copy:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: 'node'
          static_configs:
            - targets:
              - '192.168.20.19:9100'
              - '192.168.30.6:9100'
              - '192.168.20.30:9100'
              
        - job_name: 'nginx'
          static_configs:
            - targets:
              - '192.168.20.19:4040'
              - '192.168.30.6:4040'
    dest: /etc/prometheus/prometheus.yml
  notify: restart prometheus

- name: Enable Prometheus
  systemd:
    name: prometheus
    enabled: yes
    state: started
