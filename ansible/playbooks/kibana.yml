---
- name: Install Kibana from local DEB on VM
  hosts: kibana
  become: yes
  gather_facts: yes

  tasks:
    - name: Install dependencies
      ansible.builtin.apt:
        name: apt-transport-https,ca-certificates
        state: present
        update_cache: yes

    - name: Install Kibana from local DEB
      ansible.builtin.apt:
        deb: /tmp/kibana.deb
        state: present

    - name: Enable and start Kibana service
      ansible.builtin.systemd:
        name: kibana
        enabled: yes
        state: started

    - name: Wait for Kibana to be up
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 5601
        delay: 5
        timeout: 60
